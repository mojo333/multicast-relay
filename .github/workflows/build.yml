name: CI Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test ./... -v -count=1 -race

      - name: Run end-to-end tests
        working-directory: go
        run: go test -exec "sudo env MULTICAST_RELAY_E2E=1" ./cmd/... -run EndToEnd -v -count=1 -race

      - name: Run vet
        working-directory: go
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64, armv7 ]
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: armv7
            goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p ../bin
          go build -ldflags="-s -w" -o ../bin/multicast-relay-linux-${{ matrix.arch }} ./cmd/multicast-relay

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: multicast-relay-linux-${{ matrix.arch }}
          path: bin/multicast-relay-linux-${{ matrix.arch }}
